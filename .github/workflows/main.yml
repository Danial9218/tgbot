name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run tests with coverage
      run: |
        dotnet test --no-build --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    - name: Install bc (for math calculations)
      run: sudo apt-get install -y bc

    - name: Extract and show coverage percentage
      run: |
        COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
        if [ -f "$COVERAGE_FILE" ]; then
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          PERCENT=$(echo "$LINE_RATE * 100" | bc)
          echo "========================================="
          echo "✅ Покрытие кода тестами: ${PERCENT}%"
          echo "========================================="
        else
          echo "❌ Файл с покрытием не найден"
          exit 1
        fi
